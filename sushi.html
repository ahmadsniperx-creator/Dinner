<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة حجز السوشي</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fffde7; /* لون خلفية مختلف قليلاً للسوشي */
            overflow: auto;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            width: 450px;
            transition: all 0.5s ease;
        }
        h1 { color: #f9a825; margin-bottom: 30px; } /* لون أصفر للسوشي */
        .buttons-wrapper {
            display: flex;
            justify-content: center;
            gap: 20px;
            min-height: 80px;
            align-items: center;
        }
        button {
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        #sushiBtn { background-color: #ffca28; color: black; z-index: 100; }
        #pastaBtn { background-color: #e0e0e0; color: #777; }

        /* تنسيق رسالة الإلغاء */
        .cancellation-step { display: none; margin-top: 20px; text-align: center;}
        .error-box {
            border: 2px solid #f44336;
            padding: 20px;
            border-radius: 10px;
            background: #ffebee;
            color: #f44336;
            font-weight: bold;
            margin-bottom: 20px;
        }
        
        .return-btn {
            background-color: #FFC107;
            color: black;
            font-size: 16px;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
            border-radius: 12px;
            padding: 12px 25px;
            font-weight: bold;
            transition: 0.3s;
        }
        .return-btn:hover {
            background-color: #ffca28;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div class="container" id="mainCard">
    <h1 id="question">ها.. نختار إيه المرة دي؟</h1>
    
    <div id="choiceStep" class="buttons-wrapper">
        <button id="pastaBtn" disabled>مكرونة بشاميل</button>
        <button id="sushiBtn" onclick="processCancellation()">اعزمك على سوشي 🍣</button>
    </div>

    <div id="cancellationStep" class="cancellation-step">
        <div class="error-box">
            <h1 style="color: #f44336; font-size: 40px; margin-bottom: 10px;">X</h1>
            <p style="font-size: 24px; margin-bottom: 5px;">تم إلغاء الحجز</p>
            <p style="font-size: 14px; font-weight: normal; color: #777;">[خطأ غير معروف في النظام: محاولة حجز سوشي]</p>
        </div>
        
        <p style="font-size: 18px; color: #555;">يبدو أن النظام يرفض هذا الاختيار.. <br> جربي المكرونة!</p>
                <a href="lunch.html?secondTime=true" class="return-btn">عودة للاختيارات</a>
    </div>
</div>

<script>
    function processCancellation() {
        // إخفاء الاختيارات والعنوان
        document.getElementById('choiceStep').style.display = 'none';
        document.getElementById('question').style.display = 'none';
        // إظهار رسالة الإلغاء
        document.getElementById('cancellationStep').style.display = 'block';
    }
</script>

</body>
</html>
