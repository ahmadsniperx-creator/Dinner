<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام حجز الوجبات العالمي</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fff5f8;
            overflow-x: hidden;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%; /* مرونة للموبايل */
            max-width: 500px; /* عرض مريح للكمبيوتر */
            transition: all 0.5s ease;
        }
        h1 { color: #d81b60; margin-bottom: 25px; line-height: 1.4; }
        .buttons-wrapper {
            display: flex;
            justify-content: center;
            flex-wrap: wrap; /* لضمان عدم تداخل الأزرار */
            gap: 15px;
            min-height: 100px;
            align-items: center;
        }
        button {
            padding: 15px 25px;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            white-space: nowrap; /* لمنع انقسام النص داخل الزر */
        }
        #yesBtn { background-color: #ff4081; color: white; z-index: 100; }
        #noBtn { background-color: #9e9e9e; color: white; position: relative; }
        
        #bubble {
            position: fixed;
            background: #333;
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
            z-index: 1000;
            pointer-events: none;
        }

        /* تنسيق الخطوات */
        .details-step, .final-step { display: none; text-align: right; }
        .details-step h3 { color: #d81b60; }
        select {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 16px;
        }
        .final-btn { background-color: #4CAF50; color: white; width: 100%; margin-top: 20px; }
        
        .joke-wrapper {
            margin-top: 30px;
            border-top: 2px dashed #eee;
            padding-top: 20px;
            text-align: center;
        }
        .return-btn {
            background-color: #FFC107;
            color: black;
            font-size: 16px;
            text-decoration: none;
            display: inline-block;
            margin-top: 15px;
            border-radius: 12px;
            padding: 12px 25px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="bubble"></div>

<div class="container" id="mainCard">
    <h1 id="question">ناكل ايه النهاردة؟</h1>
    
    <div id="step1" class="buttons-wrapper">
        <button id="yesBtn" onclick="showStep2()">تعمليلي مكرونة بشاميل</button>
        <button id="noBtn" onmouseover="moveButton(this)">اعزمك على سوشي</button>
    </div>

    <div id="step2" class="details-step">
        <h3>اختيار ممتاز! 😍</h3>
        <p>حددي الموعد المناسب (كلها متاحة):</p>
        <select id="timeSlot">
            <option>دلوقتي حالاً</option>
            <option>يوم الجمعة</option>
            <option>يوم السبت</option>
        </select>
        <div style="background: #fff9fa; padding: 15px; border-radius: 10px;">
            <p><b>مرفقات الحجز:</b></p>
            <label><input type="checkbox" checked disabled> بيبسي مشبر 🥤</label><br>
            <label><input type="checkbox" checked disabled> مخلل مشكل 🥒</label>
        </div>
        <button class="final-btn" onclick="showFinal()">تأكيد الطلب نهائياً 🍝</button>
    </div>

    <div id="step3" class="final-step" style="text-align: center;">
        <h1 style="color: #4CAF50;">تم الحجز بنجاح!</h1>
        <div style="border: 2px dashed #4CAF50; padding: 25px; border-radius: 15px; background: #f9fff9;">
            <p style="font-size: 18px;"><b>الصنف:</b> مكرونة بشاميل</p>
            <p style="font-size: 18px;"><b>الموعد:</b> <span id="finalTime"></span></p>
        </div>
        
        <div id="jokeSection" class="joke-wrapper">
            <p style="color: #888; font-style: italic;">بهزر خلاص هعزمك على سوشي 🙄</p>
            <a href="sushi.html?secondTime=true" class="return-btn">عودة للاختيارات</a>
        </div>
    </div>
</div>

<script>
    const messages = ["حاولي تاني ", "اختاري براحتك..", "مالك في ايه؟ ", "و بعدين بقا ؟", "السوشي ممنوع!"];
    const bubble = document.getElementById('bubble');

    function moveButton(btn) {
        btn.style.position = 'fixed';
        const padding = 100;
        const maxX = window.innerWidth - btn.offsetWidth - padding;
        const maxY = window.innerHeight - btn.offsetHeight - padding;
        
        const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
        const randomY = Math.max(padding, Math.floor(Math.random() * maxY));
        
        btn.style.left = randomX + 'px';
        btn.style.top = randomY + 'px';

        bubble.innerText = messages[Math.floor(Math.random() * messages.length)];
        bubble.style.display = 'block';
        bubble.style.left = (randomX + 10) + 'px';
        bubble.style.top = (randomY - 45) + 'px';
    }

    function showStep2() {
        bubble.style.display = 'none';
        document.getElementById('step1').style.display = 'none';
        document.getElementById('question').style.display = 'none';
        document.getElementById('step2').style.display = 'block';
    }

    function showFinal() {
        const time = document.getElementById('timeSlot').value;
        document.getElementById('finalTime').innerText = time;
        document.getElementById('step2').style.display = 'none';
        document.getElementById('step3').style.display = 'block';

        // فحص إذا كانت هذه هي الزيارة الثانية من الرابط
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('secondTime') === 'true') {
            document.getElementById('jokeSection').style.display = 'none';
        }
    }
</script>

</body>
</html>
